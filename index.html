<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베이스 기타 지판 암기 도우미</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #f3f4f6;
        }

        /* Scrollbar Styling for Fretboard Container */
        .fretboard-scroll::-webkit-scrollbar {
            height: 10px;
        }
        .fretboard-scroll::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 6px;
        }
        .fretboard-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 6px;
        }
        .fretboard-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Custom Fretboard Wood Background */
        .wood-texture {
            background: linear-gradient(90deg, #2b1d14 0%, #3a271b 50%, #2b1d14 100%);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Metallic Fret Wire Divider (선명하고 두꺼운 메탈 프렛 와이어) */
        .fret-cell {
            border-right: 4px solid #d1d5db;
            box-shadow: inset -2px 0 3px rgba(255, 255, 255, 0.6), 3px 0 5px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        .fret-cell-nut {
            border-right: 8px solid #fbbf24;
            box-shadow: 3px 0 6px rgba(0, 0, 0, 0.9);
        }

        /* Inlay Marker Dots Glow */
        .inlay-dot {
            background: radial-gradient(circle, #ffffff 40%, #d1d5db 80%, #9ca3af 100%);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8), inset 0 0 2px rgba(0,0,0,0.4);
        }

        /* Note Badge Glow & Hover */
        .note-badge {
            transition: all 0.15s ease-in-out;
        }
        .note-badge:hover {
            transform: scale(1.15);
            z-index: 30;
        }

        /* Keyframe Animations for Feedback */
        @keyframes popSuccess {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popSuccess 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shakeError 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

    <!-- Header Section -->
    <header class="w-full max-w-7xl text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-extrabold text-amber-400 tracking-tight mb-2">
            🎸 베이스 기타 지판 암기 도우미
        </h1>
        <p class="text-gray-400 text-sm md:text-base">
            1번~15번 프렛의 4현(E-A-D-G) 지판 암기 및 퀴즈 연습 프로그램입니다.
        </p>
    </header>

    <!-- Interactive Control Panel -->
    <section class="w-full max-w-7xl bg-gray-800/80 backdrop-blur border border-gray-700 rounded-xl p-4 mb-4 shadow-xl flex flex-wrap items-center justify-between gap-4">
        
        <!-- Notation Toggle (Sharp / Flat) -->
        <div class="flex items-center gap-2">
            <span class="text-xs md:text-sm font-semibold text-gray-300">임시표 표기:</span>
            <div class="inline-flex rounded-md shadow-sm" role="group">
                <button type="button" onclick="setAccidental('sharp')" id="btnSharp" class="px-3 py-1.5 text-xs font-bold bg-amber-500 text-gray-900 rounded-l-lg hover:bg-amber-400 transition-colors">
                    샵 (#)
                </button>
                <button type="button" onclick="setAccidental('flat')" id="btnFlat" class="px-3 py-1.5 text-xs font-bold bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                    플랫 (♭)
                </button>
            </div>
        </div>

        <!-- Highlight Key/Note Filter -->
        <div class="flex items-center gap-2">
            <span class="text-xs md:text-sm font-semibold text-gray-300">특정 음 강조:</span>
            <select id="noteFilter" onchange="highlightNote(this.value)" class="bg-gray-900 border border-gray-600 text-amber-300 text-xs md:text-sm rounded-lg p-2 focus:ring-2 focus:ring-amber-500 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed transition-opacity">
                <option value="ALL">모든 음 전체 보기</option>
                <option value="C">C (도)</option>
                <option value="C#/Db">C# / D♭</option>
                <option value="D">D (레)</option>
                <option value="D#/Eb">D# / E♭</option>
                <option value="E">E (미)</option>
                <option value="F">F (파)</option>
                <option value="F#/Gb">F# / G♭</option>
                <option value="G">G (솔)</option>
                <option value="G#/Ab">G# / A♭</option>
                <option value="A">A (라)</option>
                <option value="A#/Bb">A# / B♭</option>
                <option value="B">B (시)</option>
            </select>
        </div>

        <!-- Mode Toggles -->
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="toggleBlindMode()" id="btnBlind" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition-colors shadow">
                🙈 블라인드 모드
            </button>
            <button onclick="toggleQuizMode()" id="btnQuiz" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-lg transition-colors shadow flex items-center gap-1">
                🎯 퀴즈 모드 시작
            </button>
        </div>
    </section>

    <!-- Main Fretboard Area -->
    <main class="w-full max-w-7xl overflow-hidden bg-gray-900 border-4 border-gray-700 rounded-2xl shadow-2xl p-4 md:p-6 mb-4">
        
        <!-- Fretboard Horizontal Scroll Wrapper -->
        <div class="fretboard-scroll overflow-x-auto pb-4">
            <div class="min-w-[1100px] relative">
                
                <!-- Fret Numbers Header Top -->
                <div class="grid grid-cols-[60px_repeat(15,1fr)] text-center text-xs font-extrabold text-amber-400 mb-2">
                    <div class="text-gray-400">개방현</div>
                    <div>1</div><div>2</div><div class="text-amber-300 font-black">3</div><div>4</div>
                    <div class="text-amber-300 font-black">5</div><div>6</div><div class="text-amber-300 font-black">7</div>
                    <div>8</div><div class="text-amber-300 font-black">9</div><div>10</div><div>11</div>
                    <div class="text-amber-300 font-black">12 (••)</div><div>13</div><div>14</div><div class="text-amber-300 font-black">15</div>
                </div>

                <!-- Main Wood Fretboard Container -->
                <div id="fretboard" class="wood-texture relative border-t-4 border-b-4 border-amber-950 rounded-sm">
                    
                    <!-- Fret Wire Background Lines Overlay (지판 전체 세로 프렛 경계선) -->
                    <div class="absolute inset-0 pointer-events-none z-10 grid grid-cols-[60px_repeat(15,1fr)]">
                        <div class="fret-cell-nut"></div><!-- Nut (0프렛) -->
                        <div class="fret-cell"></div><!-- 1 -->
                        <div class="fret-cell"></div><!-- 2 -->
                        <div class="fret-cell"></div><!-- 3 -->
                        <div class="fret-cell"></div><!-- 4 -->
                        <div class="fret-cell"></div><!-- 5 -->
                        <div class="fret-cell"></div><!-- 6 -->
                        <div class="fret-cell"></div><!-- 7 -->
                        <div class="fret-cell"></div><!-- 8 -->
                        <div class="fret-cell"></div><!-- 9 -->
                        <div class="fret-cell"></div><!-- 10 -->
                        <div class="fret-cell"></div><!-- 11 -->
                        <div class="fret-cell"></div><!-- 12 -->
                        <div class="fret-cell"></div><!-- 13 -->
                        <div class="fret-cell"></div><!-- 14 -->
                        <div class="fret-cell"></div><!-- 15 -->
                    </div>

                    <!-- Fret Marker Inlay Dots -->
                    <div class="absolute inset-0 pointer-events-none z-0">
                        <div class="grid grid-cols-[60px_repeat(15,1fr)] h-full">
                            <div></div><!-- Open String -->
                            <div></div><!-- 1 -->
                            <div></div><!-- 2 -->
                            <div class="flex items-center justify-center"><div class="w-4 h-4 rounded-full inlay-dot opacity-90"></div></div><!-- 3 -->
                            <div></div><!-- 4 -->
                            <div class="flex items-center justify-center"><div class="w-4 h-4 rounded-full inlay-dot opacity-90"></div></div><!-- 5 -->
                            <div></div><!-- 6 -->
                            <div class="flex items-center justify-center"><div class="w-4 h-4 rounded-full inlay-dot opacity-90"></div></div><!-- 7 -->
                            <div></div><!-- 8 -->
                            <div class="flex items-center justify-center"><div class="w-4 h-4 rounded-full inlay-dot opacity-90"></div></div><!-- 9 -->
                            <div></div><!-- 10 -->
                            <div></div><!-- 11 -->
                            <!-- 12 Double Dot -->
                            <div class="flex flex-col items-center justify-center gap-10">
                                <div class="w-3.5 h-3.5 rounded-full inlay-dot opacity-90"></div>
                                <div class="w-3.5 h-3.5 rounded-full inlay-dot opacity-90"></div>
                            </div>
                            <div></div><!-- 13 -->
                            <div></div><!-- 14 -->
                            <div class="flex items-center justify-center"><div class="w-4 h-4 rounded-full inlay-dot opacity-90"></div></div><!-- 15 -->
                        </div>
                    </div>

                    <!-- String 1: G String (1번줄 - 1px) -->
                    <div class="string-row relative h-14 flex items-center">
                        <div class="absolute left-0 right-0 h-[1px] bg-gradient-to-r from-gray-300 via-gray-100 to-gray-400 shadow-sm z-20 pointer-events-none"></div>
                        <div id="string-1" class="w-full grid grid-cols-[60px_repeat(15,1fr)] z-30 relative h-full"></div>
                    </div>

                    <!-- String 2: D String (2번줄 - 1.5px) -->
                    <div class="string-row relative h-14 flex items-center">
                        <div class="absolute left-0 right-0 h-[1.5px] bg-gradient-to-r from-gray-300 via-gray-100 to-gray-400 shadow-sm z-20 pointer-events-none"></div>
                        <div id="string-2" class="w-full grid grid-cols-[60px_repeat(15,1fr)] z-30 relative h-full"></div>
                    </div>

                    <!-- String 3: A String (3번줄 - 2.5px) -->
                    <div class="string-row relative h-14 flex items-center">
                        <div class="absolute left-0 right-0 h-[2.5px] bg-gradient-to-r from-yellow-100 via-gray-200 to-gray-400 shadow-md z-20 pointer-events-none"></div>
                        <div id="string-3" class="w-full grid grid-cols-[60px_repeat(15,1fr)] z-30 relative h-full"></div>
                    </div>

                    <!-- String 4: E String (4번줄 - 3.5px) -->
                    <div class="string-row relative h-14 flex items-center">
                        <div class="absolute left-0 right-0 h-[3.5px] bg-gradient-to-r from-yellow-200 via-gray-300 to-gray-500 shadow-md z-20 pointer-events-none"></div>
                        <div id="string-4" class="w-full grid grid-cols-[60px_repeat(15,1fr)] z-30 relative h-full"></div>
                    </div>

                </div>

            </div>
        </div>

    </main>

    <!-- Quiz Panel Section (Dynamic Bottom Display) -->
    <footer id="quizPanel" class="w-full max-w-7xl bg-gray-900 border-2 border-emerald-500/50 rounded-xl p-4 text-center shadow-2xl min-h-[100px] flex items-center justify-center">
        
        <!-- Default Guide State (When Quiz mode is inactive) -->
        <div id="quizGuideState" class="text-gray-400 text-sm">
            💡 상단의 <span class="text-emerald-400 font-bold">[🎯 퀴즈 모드 시작]</span> 버튼을 누르면 위치 맞추기 퀴즈가 시작됩니다!
        </div>

        <!-- Active Quiz State -->
        <div id="quizActiveState" class="hidden w-full flex flex-col md:flex-row items-center justify-between gap-4 px-4">
            
            <!-- Left: Score Dashboard -->
            <div class="flex items-center gap-4 text-xs md:text-sm font-semibold text-gray-300">
                <span class="bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                    점수: <strong id="quizScore" class="text-emerald-400 text-base ml-1">0</strong> 점
                </span>
                <span class="bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                    시도: <strong id="quizTotal" class="text-amber-400 text-base ml-1">0</strong> 회
                </span>
            </div>

            <!-- Center: Target Note Display -->
            <div class="flex items-center gap-3">
                <span class="text-sm font-bold text-gray-300">다음 음의 위치를 지판에서 누르세요:</span>
                <span id="targetNoteBadge" class="text-3xl font-black bg-amber-400 text-gray-950 px-5 py-1.5 rounded-xl shadow-lg border-2 border-white animate-pop">
                    C
                </span>
            </div>

            <!-- Right: Status Feedback & Next Button -->
            <div class="flex items-center gap-3">
                <div id="quizFeedback" class="text-sm md:text-base font-extrabold text-emerald-400 min-w-[100px] text-center">
                    문제 진행 중...
                </div>
                <button onclick="nextQuizQuestion()" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-xs text-gray-300 px-3 py-1.5 rounded-lg transition-colors">
                    패스 ➔
                </button>
            </div>

        </div>

    </footer>

    <script>
        // Chromatic scale note definitions (Standard Tuning: 4=E, 3=A, 2=D, 1=G)
        const chromaticSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const chromaticFlat  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        const openStringIndices = {
            1: 7,  // G
            2: 2,  // D
            3: 9,  // A
            4: 4   // E
        };

        let currentAccidental = 'sharp'; 
        let currentFilter = 'ALL';
        let isBlindMode = false;
        
        // Quiz Mode State Variables
        let isQuizMode = false;
        let targetNote = 'C';
        let quizScore = 0;
        let quizTotal = 0;
        let isAnsweredCurrentQuestion = false;

        // Get Note Name by string and fret
        function getNote(stringNum, fretNum, accidentalType = currentAccidental) {
            const openIndex = openStringIndices[stringNum];
            const noteIndex = (openIndex + fretNum) % 12;
            return accidentalType === 'sharp' ? chromaticSharp[noteIndex] : chromaticFlat[noteIndex];
        }

        // Get Normalized key (e.g., C# and Db both return 'C#/Db') for filtering
        function getNormalizedKey(stringNum, fretNum) {
            const openIndex = openStringIndices[stringNum];
            const sharp = chromaticSharp[(openIndex + fretNum) % 12];
            const flat = chromaticFlat[(openIndex + fretNum) % 12];
            if (sharp === flat) return sharp;
            return `${sharp}/${flat}`;
        }

        // Render Fretboard Notes
        function renderFretboard() {
            for (let stringNum = 1; stringNum <= 4; stringNum++) {
                const container = document.getElementById(`string-${stringNum}`);
                if (!container) continue;
                container.innerHTML = '';

                for (let fret = 0; fret <= 15; fret++) {
                    const noteName = getNote(stringNum, fret);
                    const normKey = getNormalizedKey(stringNum, fret);

                    const fretDiv = document.createElement('div');
                    fretDiv.className = 'flex items-center justify-center relative cursor-pointer group h-full';
                    
                    // Click handler
                    fretDiv.onclick = (e) => handleFretClick(stringNum, fret, fretDiv);

                    const badge = document.createElement('div');
                    
                    // Style condition for highlighting & filtering
                    let isFilteredOut = currentFilter !== 'ALL' && currentFilter !== normKey;
                    
                    let bgStyle = 'bg-gray-800 text-amber-300 border-amber-500/50';
                    if (fret === 0) bgStyle = 'bg-amber-600 text-gray-950 font-black border-amber-400';
                    if (currentFilter !== 'ALL' && currentFilter === normKey) {
                        bgStyle = 'bg-amber-400 text-gray-950 font-black border-white ring-4 ring-amber-400/40 scale-110 z-40';
                    }

                    // Hide text in Blind mode OR Quiz mode
                    const isHidden = isBlindMode || isQuizMode;
                    const blindClass = isHidden ? 'opacity-0' : 'opacity-100';
                    const dimClass = isFilteredOut ? 'opacity-20 scale-90' : 'opacity-100';

                    badge.className = `note-badge border px-2 py-0.5 md:px-2.5 md:py-1 rounded-full text-xs md:text-sm font-extrabold shadow-md transition-all duration-200 ${bgStyle} ${blindClass} ${dimClass}`;
                    badge.innerText = noteName;

                    fretDiv.appendChild(badge);
                    container.appendChild(fretDiv);
                }
            }
        }

        // Handle Cell/Fret Touch Interaction
        function handleFretClick(stringNum, fretNum, fretElement) {
            const badge = fretElement.querySelector('.note-badge');

            // 1. In Quiz Mode
            if (isQuizMode) {
                if (isAnsweredCurrentQuestion) return; // Prevent multiple clicks during delay

                const clickedNote = getNote(stringNum, fretNum);
                const normTarget = targetNote;
                const normClicked = getNormalizedKey(stringNum, fretNum);

                // Check correctness (handles C#/Db variations)
                const isCorrect = (clickedNote === targetNote) || 
                                  (normTarget.includes('/') && normClicked === normTarget);

                quizTotal++;
                document.getElementById('quizTotal').innerText = quizTotal;

                if (isCorrect) {
                    quizScore++;
                    document.getElementById('quizScore').innerText = quizScore;
                    
                    // Show Badge & Green Success Animation
                    badge.classList.remove('opacity-0', 'bg-gray-800', 'text-amber-300');
                    badge.classList.add('opacity-100', 'bg-emerald-400', 'text-gray-950', 'ring-4', 'ring-emerald-300', 'animate-pop');
                    
                    const feedback = document.getElementById('quizFeedback');
                    feedback.className = "text-sm md:text-base font-extrabold text-emerald-400 animate-pop";
                    feedback.innerText = "⭕ 정답입니다!";

                    isAnsweredCurrentQuestion = true;
                    setTimeout(() => {
                        nextQuizQuestion();
                    }, 1100);

                } else {
                    // Show Red Error Animation
                    badge.classList.remove('opacity-0');
                    badge.classList.add('opacity-100', 'bg-rose-600', 'text-white', 'ring-2', 'ring-rose-400', 'animate-shake');

                    const feedback = document.getElementById('quizFeedback');
                    feedback.className = "text-sm md:text-base font-extrabold text-rose-400 animate-shake";
                    feedback.innerText = `❌ 오답! (${clickedNote})`;

                    setTimeout(() => {
                        badge.classList.add('opacity-0');
                        badge.classList.remove('bg-rose-600', 'text-white', 'ring-2', 'ring-rose-400', 'animate-shake');
                    }, 800);
                }

                return;
            }

            // 2. In Blind Mode (Simple click to view note)
            if (isBlindMode) {
                badge.classList.toggle('opacity-0');
            }
        }

        // Accidental Toggle
        function setAccidental(type) {
            currentAccidental = type;
            const btnSharp = document.getElementById('btnSharp');
            const btnFlat = document.getElementById('btnFlat');

            if (type === 'sharp') {
                btnSharp.className = 'px-3 py-1.5 text-xs font-bold bg-amber-500 text-gray-900 rounded-l-lg hover:bg-amber-400 transition-colors';
                btnFlat.className = 'px-3 py-1.5 text-xs font-bold bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors';
            } else {
                btnFlat.className = 'px-3 py-1.5 text-xs font-bold bg-amber-500 text-gray-900 rounded-r-lg hover:bg-amber-400 transition-colors';
                btnSharp.className = 'px-3 py-1.5 text-xs font-bold bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors';
            }

            if (isQuizMode) {
                pickRandomTargetNote();
            }

            renderFretboard();
        }

        // Note Highlight Filter
        function highlightNote(filterValue) {
            currentFilter = filterValue;
            renderFretboard();
        }

        // Blind Quiz Mode Toggle
        function toggleBlindMode() {
            if (isQuizMode) toggleQuizMode(); // Exit quiz mode if active

            isBlindMode = !isBlindMode;
            const btn = document.getElementById('btnBlind');
            const noteFilter = document.getElementById('noteFilter');

            if (isBlindMode) {
                btn.className = 'bg-rose-600 hover:bg-rose-500 text-white text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition-colors shadow ring-2 ring-rose-400';
                btn.innerText = '👀 블라인드 종료';
                
                // Disable filter in blind mode
                noteFilter.disabled = true;
                noteFilter.value = 'ALL';
                currentFilter = 'ALL';
            } else {
                btn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition-colors shadow';
                btn.innerText = '🙈 블라인드 모드';
                
                // Re-enable filter when blind mode is turned off
                noteFilter.disabled = false;
            }
            renderFretboard();
        }

        // Quiz Mode Toggle
        function toggleQuizMode() {
            isQuizMode = !isQuizMode;
            
            const btnQuiz = document.getElementById('btnQuiz');
            const quizGuideState = document.getElementById('quizGuideState');
            const quizActiveState = document.getElementById('quizActiveState');
            const quizPanel = document.getElementById('quizPanel');
            const noteFilter = document.getElementById('noteFilter');

            if (isQuizMode) {
                if (isBlindMode) {
                    isBlindMode = false; // Turn off pure blind mode if active
                    const btnBlind = document.getElementById('btnBlind');
                    btnBlind.className = 'bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition-colors shadow';
                    btnBlind.innerText = '🙈 블라인드 모드';
                }

                noteFilter.disabled = true;
                noteFilter.value = 'ALL';
                currentFilter = 'ALL';

                btnQuiz.className = 'bg-rose-600 hover:bg-rose-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-lg transition-colors shadow ring-2 ring-rose-400 flex items-center gap-1';
                btnQuiz.innerText = '🛑 퀴즈 모드 종료';

                quizPanel.className = "w-full max-w-7xl bg-gray-900 border-2 border-amber-400/80 rounded-xl p-4 text-center shadow-2xl min-h-[100px] flex items-center justify-center";
                quizGuideState.classList.add('hidden');
                quizActiveState.classList.remove('hidden');

                quizScore = 0;
                quizTotal = 0;
                document.getElementById('quizScore').innerText = '0';
                document.getElementById('quizTotal').innerText = '0';

                nextQuizQuestion();
            } else {
                noteFilter.disabled = false;

                btnQuiz.className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-lg transition-colors shadow flex items-center gap-1';
                btnQuiz.innerText = '🎯 퀴즈 모드 시작';

                quizPanel.className = "w-full max-w-7xl bg-gray-900 border-2 border-emerald-500/50 rounded-xl p-4 text-center shadow-2xl min-h-[100px] flex items-center justify-center";
                quizGuideState.classList.remove('hidden');
                quizActiveState.classList.add('hidden');
            }

            renderFretboard();
        }

        // Pick Next Quiz Target Note
        function pickRandomTargetNote() {
            const scale = currentAccidental === 'sharp' ? chromaticSharp : chromaticFlat;
            const randomIndex = Math.floor(Math.random() * scale.length);
            targetNote = scale[randomIndex];

            const badge = document.getElementById('targetNoteBadge');
            badge.innerText = targetNote;
            badge.classList.remove('animate-pop');
            void badge.offsetWidth; // Trigger reflow
            badge.classList.add('animate-pop');
        }

        // Move to Next Question
        function nextQuizQuestion() {
            isAnsweredCurrentQuestion = false;
            pickRandomTargetNote();

            const feedback = document.getElementById('quizFeedback');
            feedback.className = "text-sm md:text-base font-semibold text-gray-400";
            feedback.innerText = "위치를 선택하세요";

            renderFretboard();
        }

        // Initial Load
        window.onload = function() {
            renderFretboard();
        };
    </script>
</body>
</html>
